<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razão, controle financeiro de Pedro e Sofia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0E6;
    --paper-line:#D7DCC9;
    --panel:#F7F8F2;
    --ink:#1F2E22;
    --ink-soft:#4B5A45;
    --muted:#767C6E;
    --gold:#A97A22;
    --gold-soft:#EADFC2;
    --good:#3E6B52;
    --good-soft:#DCE8DE;
    --bad:#9C3B2E;
    --bad-soft:#F1DAD3;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    margin:0 0 .4em 0;
    color:var(--ink);
  }
  h1{font-size:1.5rem;}
  h2{font-size:1.15rem; border-bottom:1px solid var(--paper-line); padding-bottom:.35em;}
  h3{font-size:.95rem; color:var(--ink-soft); font-weight:600;}
  p{line-height:1.5;}
  button{
    font-family:inherit;
    font-size:.85rem;
    cursor:pointer;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:.5em 1em;
    border-radius:var(--radius);
  }
  button.secondary{background:transparent; color:var(--ink); border-color:var(--paper-line);}
  button.danger{background:transparent; color:var(--bad); border-color:var(--bad-soft);}
  button.small{padding:.3em .7em; font-size:.78rem;}
  input, select{
    font-family:inherit;
    font-size:.85rem;
    padding:.5em .6em;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
  }
  label{display:block; font-size:.75rem; color:var(--ink-soft); margin-bottom:.25em;}
  .field{margin-bottom:.8em;}
  .row{display:flex; gap:1em; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:150px;}

  /* --- login --- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
  }
  #login-screen[hidden]{display:none;}
  #login-screen .box{
    background:var(--panel);
    border:1px solid var(--paper-line);
    padding:2.2em;
    width:320px;
    border-radius:var(--radius);
  }
  #login-screen .box h1{margin-bottom:.1em;}
  #login-screen .sub{color:var(--muted); font-size:.85rem; margin-bottom:1.4em;}
  #login-error{color:var(--bad); font-size:.8rem; min-height:1.2em; margin-top:.5em;}

  /* --- shell --- */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:1em 1.2em 0 1.2em;
  }
  header .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.8em;}
  header .top h1{color:var(--paper); font-size:1.2rem;}
  header .top button{background:transparent; border-color:rgba(237,240,230,.4); color:var(--paper);}
  nav{display:flex; gap:.2em; flex-wrap:wrap;}
  nav button{
    background:rgba(237,240,230,.08);
    border:1px solid rgba(237,240,230,.25);
    border-bottom:none;
    color:rgba(237,240,230,.75);
    border-radius:4px 4px 0 0;
    padding:.6em 1em;
  }
  nav button.active{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
    font-weight:600;
  }
  main{
    max-width:980px;
    margin:0 auto;
    padding:1.4em 1.2em 4em 1.2em;
    background-image: repeating-linear-gradient(var(--paper) 0 2.05em, var(--paper-line) 2.05em 2.1em);
  }
  .tab-panel[hidden]{display:none;}
  .panel-block{
    background:var(--panel);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:1.2em 1.4em;
    margin-bottom:1.2em;
  }
  .cards-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1em;}
  .stat-card{
    background:var(--panel);
    border:1px solid var(--paper-line);
    border-left:3px solid var(--gold);
    padding:1em 1.1em;
    border-radius:var(--radius);
  }
  .stat-card .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .stat-card .value{font-family:'Source Serif 4',serif; font-size:1.5rem; margin-top:.15em;}
  .stat-card.bad{border-left-color:var(--bad);}
  .stat-card.good{border-left-color:var(--good);}

  table{width:100%; border-collapse:collapse; font-size:.85rem;}
  th{text-align:left; font-weight:600; color:var(--ink-soft); border-bottom:1px solid var(--ink); padding:.5em .4em; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em;}
  td{padding:.55em .4em; border-bottom:1px solid var(--paper-line);}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right; font-variant-numeric: tabular-nums;}
  .table-wrap{overflow-x:auto;}

  .progress{height:8px; background:var(--paper-line); border-radius:4px; overflow:hidden; margin-top:.4em;}
  .progress > div{height:100%; background:var(--good);}
  .progress.warn > div{background:var(--gold);}
  .progress.over > div{background:var(--bad);}

  .alert-banner{
    border:1px solid var(--bad-soft);
    background:var(--bad-soft);
    color:var(--bad);
    padding:.7em 1em;
    border-radius:var(--radius);
    font-size:.85rem;
    margin-bottom:.6em;
  }
  .alert-banner.warn{border-color:var(--gold-soft); background:var(--gold-soft); color:#7A5615;}

  .pill{
    display:inline-block;
    font-size:.7rem;
    padding:.15em .55em;
    border-radius:12px;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
  }

  .subtabs{display:flex; gap:.3em; margin-bottom:1em; border-bottom:1px solid var(--paper-line);}
  .subtabs button{background:transparent; border:none; color:var(--muted); padding:.5em .2em; margin-right:1em; border-bottom:2px solid transparent; border-radius:0;}
  .subtabs button.active{color:var(--ink); border-bottom-color:var(--gold); font-weight:600;}

  .hint{font-size:.75rem; color:var(--muted); margin-top:.3em;}
  .empty{color:var(--muted); font-size:.85rem; padding:.6em 0;}

  @media (max-width:640px){
    main{padding:1em .7em 4em .7em;}
    nav{overflow-x:auto; flex-wrap:nowrap;}
    nav button{white-space:nowrap;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>Razão</h1>
    <div class="sub">Controle financeiro de Pedro e Sofia</div>
    <div class="field">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" style="width:100%">
    </div>
    <div class="field">
      <label for="login-pass">Senha</label>

    </div>
    <button id="btn-login" style="width:100%">Entrar</button>

</div>

<div id="app" hidden>
  <header>
    <div class="top">

      <button id="btn-logout" class="small">Sair</button>
    </div>
    <nav id="main-nav">
      <button data-tab="dashboard" class="active">Dashboard</button>

    <section id="tab-lancamentos" class="tab-panel" hidden></section>
    <section id="tab-cartoes" class="tab-panel" hidden></section>
    <section id="tab-categorias" class="tab-panel" hidden></section>
    <section id="tab-planejamento" class="tab-panel" hidden></section>
    <section id="tab-relatorios" class="tab-panel" hidden></section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getDatabase, ref, onValue, push, set, update, remove }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

/* ======================================================================
   1) CONFIGURAÇÃO DO FIREBASE
   Cole aqui as credenciais do SEU projeto (veja o passo a passo enviado
   junto com este arquivo). Sem isso o app não funciona.
====================================================================== */
const firebaseConfig = {

  authDomain: "financas-pedro-sofia.firebaseapp.com",
  databaseURL: "https://financas-pedro-sofia-default-rtdb.firebaseio.com",
  projectId: "financas-pedro-sofia",
  storageBucket: "financas-pedro-sofia.firebasestorage.app",
  messagingSenderId: "204208048869",
  appId: "1:204208048869:web:d25cfb35ef81d2973e620c"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

/* ======================================================================
   2) ESTADO LOCAL (espelha o banco em tempo real)
====================================================================== */
const state = {
  categorias: {},
  cartoes: {},
  lancamentos: {},
  metas: {},
  rendas: {},
  contasFixas: {},
  casamento: { dataCasamento:"", metaReservaMensal:0, reservaAcumulada:0 }
};
let view = "casal"; // 'pedro' | 'sofia' | 'casal'

const PESSOAS = [["pedro","Pedro"],["sofia","Sofia"],["casal","Casal"]];
const FORMAS = [["debito","Débito"],["pix","PIX"],["credito","Crédito"]];

function fmtBRL(v){
  return (Number(v)||0).toLocaleString('pt-BR',{style:'currency', currency:'BRL'});
}
function labelPessoa(p){ return PESSOAS.find(x=>x[0]===p)?.[1] || p; }
function hoje(){ return new Date().toISOString().slice(0,10); }
function mesAtual(){ return new Date().toISOString().slice(0,7); }

/* ======================================================================
   3) AUTENTICAÇÃO
====================================================================== */
document.getElementById('btn-login').addEventListener('click', ()=>{
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  document.getElementById('login-error').textContent = "";
  signInWithEmailAndPassword(auth, email, pass).catch(err=>{
    document.getElementById('login-error').textContent = "E-mail ou senha inválidos.";
  });
});
document.getElementById('btn-logout').addEventListener('click', ()=> signOut(auth));

onAuthStateChanged(auth, user=>{
  document.getElementById('login-screen').hidden = !!user;
  document.getElementById('app').hidden = !user;
  if(user) startListeners();
});

/* ======================================================================
   4) LISTENERS EM TEMPO REAL
====================================================================== */
let listenersStarted = false;
function startListeners(){
  if(listenersStarted) return;
  listenersStarted = true;
  onValue(ref(db,'categorias'), s=>{ state.categorias = s.val()||{}; renderAll(); });
  onValue(ref(db,'cartoes'), s=>{ state.cartoes = s.val()||{}; renderAll(); });
  onValue(ref(db,'lancamentos'), s=>{ state.lancamentos = s.val()||{}; renderAll(); });
  onValue(ref(db,'metas'), s=>{ state.metas = s.val()||{}; renderAll(); });
  onValue(ref(db,'rendas'), s=>{ state.rendas = s.val()||{}; renderAll(); });
  onValue(ref(db,'contasFixas'), s=>{ state.contasFixas = s.val()||{}; renderAll(); });
  onValue(ref(db,'casamento'), s=>{
    state.casamento = s.val() || { dataCasamento:"", metaReservaMensal:0, reservaAcumulada:0 };
    state.casamento.reservaAcumulada = state.casamento.reservaAcumulada || 0;
    renderAll();
  });
}

/* ======================================================================
   5) REGRAS DE NEGÓCIO: cartão, competência, divisão de gasto casal
====================================================================== */

// Em que competência (AAAA-MM) uma compra no crédito cai, dado o dia de
// fechamento do cartão. Compra até o dia anterior ao fechamento cai no mês
// corrente; no dia do fechamento (inclusive) em diante, já cai no mês seguinte.
function gerarCompetencias(dataStr, diaFechamento, parcelas){
  const [y,m,d] = dataStr.split('-').map(Number);
  let baseIdx = (m-1) + (d >= diaFechamento ? 1 : 0);
  const out = [];
  for(let i=0;i<parcelas;i++){
    const idx = baseIdx + i;
    const yy = y + Math.floor(idx/12);
    const mm = (idx % 12) + 1;
    out.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return out;
}

// Quanto de um lançamento entra na visão de uma pessoa (pedro/sofia) ou
// na visão casal (soma tudo, sem duplicar).
function valorParaVisao(lanc, visao){
  const valor = Number(lanc.valor)||0;
  if(visao === 'casal') return valor;
  if(lanc.responsavel === visao) return valor;
  if(lanc.responsavel === 'casal'){
    if(lanc.divisaoModo === 'integral') return valor;
    const perc = visao==='pedro' ? Number(lanc.percPedro ?? 50) : Number(lanc.percSofia ?? 50);
    return valor * (perc/100);
  }
  return 0;
}

function inicioFimSemana(d){
  const dt = new Date(d+"T00:00:00");
  const dow = (dt.getDay()+6)%7; // 0 = segunda
  const seg = new Date(dt); seg.setDate(dt.getDate()-dow);
  const dom = new Date(seg); dom.setDate(seg.getDate()+6);
  return [seg.toISOString().slice(0,10), dom.toISOString().slice(0,10)];
}

function inicioFimMes(d){
  const dt = new Date(d+"T00:00:00");
  const ini = new Date(dt.getFullYear(), dt.getMonth(), 1);
  const fim = new Date(dt.getFullYear(), dt.getMonth()+1, 0);
  return [ini.toISOString().slice(0,10), fim.toISOString().slice(0,10)];
}

function inicioFimAno(d){
  const dt = new Date(d+"T00:00:00");
  return [`${dt.getFullYear()}-01-01`, `${dt.getFullYear()}-12-31`];
}

// Gasto real por data da transação (não pela competência da fatura), usado
// no resumo de gastos do dia a dia (hoje, semana, mês, ano).
function gastoNoPeriodo(inicio, fim, visao){
  return Object.values(state.lancamentos)
    .filter(l => (l.tipo||'despesa')==='despesa' && l.data>=inicio && l.data<=fim)
    .reduce((s,l)=> s+valorParaVisao(l,visao), 0);
}

// Uma fonte de renda recorrente só conta num mês (AAAA-MM) se esse mês
// estiver dentro do período dela. Sem dataInicio/dataFim = sempre ativa.
function rendaAtivaNoMes(r, mes){
  if(r.dataInicio && mes < r.dataInicio) return false;
  if(r.dataFim && mes > r.dataFim) return false;
  return true;
}

function formatMesAno(ym){
  if(!ym) return '';
  const [y,m] = ym.split('-');
  return `${m}/${y}`;
}

function limiteCategoria(cat, visao, periodo){
  if(!cat) return 0;
  const chave = (periodo==='mensal' ? 'limMes' : 'limSem') + (visao==='pedro'?'Pedro':visao==='sofia'?'Sofia':'Casal');
  return Number(cat[chave]||0);
}

function gastoCategoria(catId, visao, periodo){
  const list = Object.values(state.lancamentos).filter(l=>l.categoriaId===catId && (l.tipo||'despesa')==='despesa');
  let total = 0;
  if(periodo==='mensal'){
    const comp = mesAtual();
    list.forEach(l=>{ if((l.competencia||l.data.slice(0,7))===comp) total += valorParaVisao(l,visao); });
  } else {
    const [seg,dom] = inicioFimSemana(hoje());
    list.forEach(l=>{ if(l.data>=seg && l.data<=dom) total += valorParaVisao(l,visao); });
  }
  return total;
}

function calcularAlertas(visao){
  const alertas = [];
  Object.entries(state.categorias).forEach(([id,cat])=>{
    ['mensal','semanal'].forEach(periodo=>{
      const limite = limiteCategoria(cat, visao, periodo);
      if(limite<=0) return;
      const gasto = gastoCategoria(id, visao, periodo);
      const perc = gasto/limite;
      if(perc>=1) alertas.push({nivel:'over', texto:`${cat.nome}: ${fmtBRL(gasto)} de ${fmtBRL(limite)} (${periodo}), limite ultrapassado.`});
      else if(perc>=0.8) alertas.push({nivel:'warn', texto:`${cat.nome}: ${fmtBRL(gasto)} de ${fmtBRL(limite)} (${periodo}), acima de 80%.`});
    });
  });
  return alertas;
}

/* ======================================================================
   6) NAVEGAÇÃO ENTRE ABAS
====================================================================== */
document.getElementById('main-nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('#main-nav button').forEach(b=>b.classList.toggle('active', b===btn));
  document.querySelectorAll('.tab-panel').forEach(p=>p.hidden = (p.id !== 'tab-'+btn.dataset.tab));
});

function renderAll(){
  renderDashboard();
  renderLancamentos();
  renderCartoes();
  renderCategorias();
  renderPlanejamento();
  renderRelatorios();
}

/* ======================================================================
   7) DASHBOARD
====================================================================== */
let dashMes = mesAtual(); // mês de referência do dashboard (navegável)

function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  const alertas = calcularAlertas(view);
  const comp = dashMes;

  const gastosMes = Object.values(state.lancamentos)
    .filter(l => (l.tipo||'despesa')==='despesa' && (l.competencia||l.data.slice(0,7))===comp)
    .reduce((s,l)=> s+valorParaVisao(l,view), 0);

  const rendaRecorrenteMes = Object.values(state.rendas)
    .filter(r => (view==='casal' || r.responsavel===view || r.responsavel==='casal') && r.recorrente && rendaAtivaNoMes(r, comp))
    .reduce((s,r)=> s + (Number(r.valor)||0), 0);

  const receitasLancadasMes = Object.values(state.lancamentos)
    .filter(l => l.tipo==='receita' && (l.competencia||l.data.slice(0,7))===comp)
    .reduce((s,l)=> s+valorParaVisao(l,view), 0);

  const rendaMes = rendaRecorrenteMes + receitasLancadasMes;

  const saldo = rendaMes - gastosMes;

  const gastoHoje = gastoNoPeriodo(hoje(), hoje(), view);
  const [segS,domS] = inicioFimSemana(hoje());
  const gastoSemana = gastoNoPeriodo(segS, domS, view);
  const [iniM,fimM] = inicioFimMes(comp+'-01');
  const gastoMesReal = gastoNoPeriodo(iniM, fimM, view);
  const [iniA,fimA] = inicioFimAno(comp+'-01');
  const gastoAno = gastoNoPeriodo(iniA, fimA, view);

  const cas = state.casamento;
  const meses = mesesAte(cas.dataCasamento);
  const metaTotal = Number(cas.metaReservaMensal||0) * Math.max(meses,0);
  const reservaAtual = Number(cas.reservaAcumulada||0);
  const reservaPerc = metaTotal>0 ? Math.min(100, (reservaAtual/metaTotal)*100) : 0;

  // faturas em aberto
  const faturasHtml = Object.entries(state.cartoes).map(([id,c])=>{
    if(view!=='casal' && c.titular!==view && c.titular!=='casal') return '';
    const totalFatura = Object.values(state.lancamentos)
      .filter(l=>l.cartaoId===id && l.forma==='credito' && l.competencia===comp)
      .reduce((s,l)=> s+Number(l.valor||0), 0);
    const venc = dataVencimento(comp, c.diaFechamento, c.diaVencimento);
    const dias = Math.ceil((new Date(venc) - new Date(hoje()))/86400000);
    const alerta = dias<=3 && dias>=0;
    return `<tr><td>${c.nome}</td><td>${labelPessoa(c.titular)}</td>
      <td class="num">${fmtBRL(totalFatura)}</td>
      <td class="num ${alerta?'':''}">${venc.split('-').reverse().join('/')} ${alerta?'<span class="pill" style="border-color:var(--bad-soft);color:var(--bad)">vence em '+dias+'d</span>':''}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <div class="panel-block">
      <div class="row" style="align-items:center; margin-bottom:0;">
        <h2 style="border:none; margin:0;">Visão</h2>
        <div class="field" style="max-width:200px; margin:0;">
          <select id="view-select">
            ${PESSOAS.map(([v,l])=>`<option value="${v}" ${v===view?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="max-width:170px; margin:0;">
          <label style="margin-bottom:.1em;">Mês de referência</label>
          <input type="month" id="dash-mes-select" value="${comp}">
        </div>
        ${comp!==mesAtual() ? `<button id="dash-mes-hoje" class="secondary small" style="align-self:flex-end;">voltar pro mês atual</button>` : ''}
      </div>
    </div>

    ${alertas.length ? `<div class="panel-block">
      <h2>Alertas</h2>
      ${alertas.map(a=>`<div class="alert-banner ${a.nivel==='warn'?'warn':''}">${a.texto}</div>`).join('')}
    </div>` : ''}

    <div class="panel-block">
      <h2>Resumo de gastos, ${formatMesAno(comp)}</h2>
      <p class="hint">Baseado na data real de cada gasto, para o planejamento do dia a dia (não é a fatura do cartão, que considera o mês de fechamento). Hoje e esta semana sempre mostram o momento atual, independente do mês escolhido acima.</p>
      <div class="cards-grid">
        <div class="stat-card"><div class="label">Hoje</div><div class="value">${fmtBRL(gastoHoje)}</div></div>
        <div class="stat-card"><div class="label">Esta semana</div><div class="value">${fmtBRL(gastoSemana)}</div></div>

        <div class="value">${fmtBRL(saldo)}</div>
      </div>

        <div class="label">Gasto na fatura, ${formatMesAno(comp)}</div>

  `;
  document.getElementById('view-select').addEventListener('change', e=>{ view = e.target.value; renderAll(); });
  document.getElementById('dash-mes-select').addEventListener('change', e=>{

    dashMes = e.target.value;
    renderDashboard();
  });
  document.getElementById('dash-mes-hoje')?.addEventListener('click', ()=>{
    dashMes = mesAtual();
    renderDashboard();
  });
}

function mesesAte(dataStr){
  if(!dataStr) return 0;
  const alvo = new Date(dataStr+"T00:00:00");
  const agora = new Date();
  return Math.max(0, (alvo.getFullYear()-agora.getFullYear())*12 + (alvo.getMonth()-agora.getMonth()));
}

function dataVencimento(competencia, diaFechamento, diaVencimento){
  let [y,m] = competencia.split('-').map(Number);
  if(Number(diaVencimento) < Number(diaFechamento)) { m += 1; if(m>12){m=1; y+=1;} }
  return `${y}-${String(m).padStart(2,'0')}-${String(diaVencimento).padStart(2,'0')}`;
}

let editandoLancamento = null;

// Filtros e paginação da lista de lançamentos (persistem entre re-renderizações).
// mes = '' significa "todos os meses" (aí a lista é paginada de 30 em 30).
const filtroLanc = { base:'fatura', mes:mesAtual(), resp:'', tipo:'', cat:'', forma:'', cartao:'', q:'', pagina:1 };
const POR_PAGINA = 30;
function mesDoLanc(l, base){
  return base==='data' ? l.data.slice(0,7) : (l.competencia || l.data.slice(0,7));
}
function somaMes(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

        </div>
        <div class="field"><label>Tipo</label>
          <select id="f-tipo">
            <option value="">Todos</option>
            <option value="despesa" ${filtroLanc.tipo==='despesa'?'selected':''}>Despesas</option>
            <option value="receita" ${filtroLanc.tipo==='receita'?'selected':''}>Receitas</option>

        </div>
      </div>
      <div class="row" style="align-items:flex-end;">
        <div class="field"><label>Categoria</label>
          <select id="f-cat"><option value="">Todas</option>${Object.entries(state.categorias).map(([id,c])=>`<option value="${id}" ${filtroLanc.cat===id?'selected':''}>${c.nome}</option>`).join('')}</select>
        </div>

        </div>
        <div class="field"><label>Cartão</label>
          <select id="f-cartao"><option value="">Todos</option>${Object.entries(state.cartoes).map(([id,c])=>`<option value="${id}" ${filtroLanc.cartao===id?'selected':''}>${c.nome}</option>`).join('')}</select>
        </div>

      </div>
      <div style="display:flex; gap:.5em; flex-wrap:wrap; margin-bottom:.4em;">
        <button type="button" class="secondary small" id="f-mes-atual">Mês atual</button>
        <button type="button" class="secondary small" id="f-mes-todos">Todos os meses</button>
        <button type="button" class="secondary small" id="f-limpar">Limpar filtros</button>
      </div>
      <p class="hint">Mês da fatura agrupa as parcelas do cartão pelo mês em que cada uma vence na fatura. Data da compra agrupa pelo dia em que a compra foi feita. O filtro Responsável mostra só o que foi lançado para aquela pessoa.</p>
      <div id="lanc-lista-wrap"></div>
    </div>
  `;

  const tipoSel = document.getElementById('lanc-tipo');
  const formaSel = document.getElementById('lanc-forma');
  const respSel = document.getElementById('lanc-responsavel');
  const categoriaSel = document.getElementById('lanc-categoria');
  const cartaoSel = document.querySelector('#lanc-cartao-field select[name=cartaoId]');
  const parceladoSel = document.getElementById('lanc-parcelado');

  const toggleFields = ()=>{
    const isDespesa = tipoSel.value === 'despesa';
    document.getElementById('lanc-categoria-field').hidden = !isDespesa;
    document.getElementById('lanc-forma-field').hidden = !isDespesa;
    categoriaSel.required = isDespesa;

    const forma = formaSel.value;
    const showCartao = isDespesa && (forma==='credito' || forma==='debito');
    document.getElementById('lanc-cartao-field').hidden = !showCartao;
    cartaoSel.required = isDespesa && forma==='credito';

    const showParcela = isDespesa && forma==='credito' && !editandoLancamento;
    document.getElementById('lanc-parcela-row').hidden = !showParcela;
    const showParcelasDetalhe = showParcela && parceladoSel.value==='sim';
    document.getElementById('lanc-parcelas-qtd-field').hidden = !showParcelasDetalhe;
    document.getElementById('lanc-valor-modo-field').hidden = !showParcelasDetalhe;

    document.getElementById('lanc-casal-fields').hidden = respSel.value !== 'casal';
  };
  tipoSel.addEventListener('change', toggleFields);
  formaSel.addEventListener('change', toggleFields);
  respSel.addEventListener('change', toggleFields);
  parceladoSel.addEventListener('change', toggleFields);
  toggleFields();

  const divisaoSel = document.getElementById('lanc-divisao');
  const toggleDivisaoOpacidade = ()=>{
    const isProp = divisaoSel.value==='proporcional';
    document.getElementById('lanc-perc-pedro').style.opacity = isProp?1:.4;
    document.getElementById('lanc-perc-sofia').style.opacity = isProp?1:.4;
  };
  divisaoSel?.addEventListener('change', toggleDivisaoOpacidade);
  toggleDivisaoOpacidade();

  document.getElementById('form-lancamento').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const tipo = fd.get('tipo');
    const data = fd.get('data');
    const descricao = fd.get('descricao');
    const valorTotal = Number(fd.get('valor'));
    const responsavel = fd.get('responsavel');
    const divisaoModo = fd.get('divisaoModo') || 'proporcional';
    const percPedro = Number(fd.get('percPedro')||50);
    const percSofia = Number(fd.get('percSofia')||50);

    if(editandoLancamento){
      const id = editandoLancamento;
      if(tipo==='receita'){
        update(ref(db,'lancamentos/'+id), {
          tipo:'receita', data, competencia:data.slice(0,7), descricao, valor:valorTotal,
          categoriaId:'', responsavel, forma:'', cartaoId:'', divisaoModo, percPedro, percSofia
        });
      } else {
        const categoriaId = fd.get('categoriaId');
        const forma = fd.get('forma');
        const cartaoId = fd.get('cartaoId') || '';
        let competencia = data.slice(0,7);
        if(forma==='credito'){
          const cartao = state.cartoes[cartaoId];
          if(!cartao){ alert('Selecione um cartão de crédito cadastrado.'); return; }
          competencia = gerarCompetencias(data, Number(cartao.diaFechamento), 1)[0];
        }
        update(ref(db,'lancamentos/'+id), {
          tipo:'despesa', data, competencia, descricao, valor:valorTotal,
          categoriaId, responsavel, forma, cartaoId, divisaoModo, percPedro, percSofia
        });
      }
      editandoLancamento = null;
      renderLancamentos();
      return;
    }

    if(tipo==='receita'){
      push(ref(db,'lancamentos'), {
        tipo:'receita', data, competencia:data.slice(0,7), descricao, valor:valorTotal,
        categoriaId:'', responsavel, forma:'', cartaoId:'',
        parcelaAtual:1, parcelaTotal:1,
        divisaoModo, percPedro, percSofia
      });
    } else {
      const categoriaId = fd.get('categoriaId');
      const forma = fd.get('forma');
      const cartaoId = fd.get('cartaoId') || '';
      const parcelado = forma==='credito' && parceladoSel.value==='sim';
      const parcelas = parcelado ? Math.max(2, Number(fd.get('parcelas')||2)) : 1;
      const valorModo = fd.get('valorModo') || 'parcela';

      if(forma==='credito'){
        const cartao = state.cartoes[cartaoId];
        if(!cartao){ alert('Selecione um cartão de crédito cadastrado.'); return; }
        const comps = gerarCompetencias(data, Number(cartao.diaFechamento), parcelas);
        const valorParcela = valorModo==='total' ? Math.round((valorTotal/parcelas)*100)/100 : valorTotal;
        comps.forEach((comp,idx)=>{
          push(ref(db,'lancamentos'), {
            tipo:'despesa', data, competencia:comp,
            descricao: descricao + (parcelas>1 ? ` (${idx+1}/${parcelas})` : ''),
            valor: valorParcela, categoriaId, responsavel, forma, cartaoId,
            parcelaAtual: idx+1, parcelaTotal: parcelas,
            divisaoModo, percPedro, percSofia
          });
        });
      } else {
        push(ref(db,'lancamentos'), {
          tipo:'despesa', data, competencia:data.slice(0,7), descricao, valor:valorTotal,
          categoriaId, responsavel, forma, cartaoId,
          parcelaAtual:1, parcelaTotal:1,
          divisaoModo, percPedro, percSofia
        });

    toggleFields();

  // ---- lista filtrada e paginada ----
  const wrap = document.getElementById('lanc-lista-wrap');
  const desenhaLista = ()=>{
    const f = filtroLanc;
    const todos = Object.entries(state.lancamentos)
      .filter(([id,l])=>{
        if(f.mes && mesDoLanc(l,f.base)!==f.mes) return false;
        if(f.resp && l.responsavel!==f.resp) return false;
        if(f.tipo && (l.tipo||'despesa')!==f.tipo) return false;
        if(f.cat && l.categoriaId!==f.cat) return false;
        if(f.forma && l.forma!==f.forma) return false;
        if(f.cartao && l.cartaoId!==f.cartao) return false;
        if(f.q && !(l.descricao||'').toLowerCase().includes(f.q.trim().toLowerCase())) return false;
        return true;
      })
      .sort((a,b)=> b[1].data.localeCompare(a[1].data) || (Number(a[1].parcelaAtual||0)-Number(b[1].parcelaAtual||0)));

    const totalDesp = todos.reduce((s,[,l])=> (l.tipo||'despesa')==='despesa' ? s+Number(l.valor||0) : s, 0);
    const totalRec = todos.reduce((s,[,l])=> l.tipo==='receita' ? s+Number(l.valor||0) : s, 0);

    const paginar = !f.mes;
    const totalPaginas = paginar ? Math.max(1, Math.ceil(todos.length/POR_PAGINA)) : 1;
    if(f.pagina>totalPaginas) f.pagina = totalPaginas;
    const visiveis = paginar ? todos.slice((f.pagina-1)*POR_PAGINA, f.pagina*POR_PAGINA) : todos;

    const linhas = visiveis.map(([id,l])=>{

      const formaTxt = isReceita ? '-' : (FORMAS.find(x=>x[0]===l.forma)?.[1]||l.forma);

      <tr>
        <td>${l.data.split('-').reverse().join('/')}</td>

        <td>${labelPessoa(l.responsavel)}</td>
        <td>${formaTxt}${cartaoNome && !isReceita ? `<div class="hint">${cartaoNome}</div>` : ''}</td>
        <td class="num">${fatura}</td>
        <td class="num" style="color:${isReceita?'var(--good)':'var(--bad)'}">${isReceita?'+':'-'} ${fmtBRL(l.valor)}</td>
        <td><button class="secondary small" data-edit-lanc="${id}">editar</button> <button class="danger small" data-del-lanc="${id}">excluir</button></td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `
      <div class="cards-grid" style="margin:1em 0;">
        <div class="stat-card"><div class="label">Lançamentos</div><div class="value">${todos.length}</div></div>
        <div class="stat-card bad"><div class="label">Despesas</div><div class="value">${fmtBRL(totalDesp)}</div></div>
        <div class="stat-card good"><div class="label">Receitas</div><div class="value">${fmtBRL(totalRec)}</div></div>
      </div>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Resp.</th><th>Forma</th><th class="num">Fatura</th><th class="num">Valor</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="8" class="empty">Nenhum lançamento com esses filtros.</td></tr>'}</tbody>
      </table>
      </div>
      ${paginar && totalPaginas>1 ? `
      <div style="display:flex; gap:.8em; align-items:center; margin-top:.8em;">
        <button type="button" class="secondary small" id="f-pag-ant" ${f.pagina<=1?'disabled':''}>Anterior</button>
        <span class="hint" style="margin:0;">Página ${f.pagina} de ${totalPaginas}</span>
        <button type="button" class="secondary small" id="f-pag-prox" ${f.pagina>=totalPaginas?'disabled':''}>Próxima</button>
      </div>` : ''}
    `;

    wrap.querySelectorAll('[data-del-lanc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(editandoLancamento===b.dataset.delLanc) editandoLancamento = null;
        remove(ref(db,'lancamentos/'+b.dataset.delLanc));
      });
    });
    wrap.querySelectorAll('[data-edit-lanc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        editandoLancamento = b.dataset.editLanc;
        renderLancamentos();
        document.getElementById('form-lancamento').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
    document.getElementById('f-pag-ant')?.addEventListener('click', ()=>{ filtroLanc.pagina--; desenhaLista(); });
    document.getElementById('f-pag-prox')?.addEventListener('click', ()=>{ filtroLanc.pagina++; desenhaLista(); });
  };

  const mesInput = document.getElementById('f-mes');
  const aplicaMes = (ym)=>{ filtroLanc.mes = ym; filtroLanc.pagina = 1; mesInput.value = ym; desenhaLista(); };
  mesInput.addEventListener('change', ()=> aplicaMes(mesInput.value));
  document.getElementById('f-mes-ant').addEventListener('click', ()=> aplicaMes(somaMes(filtroLanc.mes || mesAtual(), -1)));
  document.getElementById('f-mes-prox').addEventListener('click', ()=> aplicaMes(somaMes(filtroLanc.mes || mesAtual(), 1)));
  document.getElementById('f-mes-atual').addEventListener('click', ()=> aplicaMes(mesAtual()));
  document.getElementById('f-mes-todos').addEventListener('click', ()=> aplicaMes(''));
  [['f-base','base'],['f-resp','resp'],['f-tipo','tipo'],['f-cat','cat'],['f-forma','forma'],['f-cartao','cartao']].forEach(([id,chave])=>{
    document.getElementById(id).addEventListener('change', e=>{ filtroLanc[chave] = e.target.value; filtroLanc.pagina = 1; desenhaLista(); });

// Soma as contas fixas de um mês, unificando duas origens:
// 1) a coleção "contasFixas" (assinaturas, gasolina etc., sempre; e mensalidades
//    antigas ainda não convertidas, enquanto restarem meses);
// 2) despesas lançadas em "Lançamentos" como parceladas (parcelaTotal>1), cuja
//    competência cai nesse mês (mensalidades e financiamentos no cartão).
// "indiceRelativo" é quantos meses à frente do mês atual o "mes" está (0 = mês atual).
function totalContasFixasMes(mes, indiceRelativo){
  let total = Object.values(state.contasFixas).reduce((s,it)=>{
    if(it.tipo==='parcela'){
      const restante = Number(it.mesesRestantes||0) - indiceRelativo;
      if(restante<=0) return s;
    }
    return s + Number(it.valor||0);
  },0);

  total += Object.values(state.lancamentos).reduce((s,l)=>{
    if((l.tipo||'despesa')!=='despesa') return s;
    if(!(Number(l.parcelaTotal||1) > 1)) return s;
    const comp = l.competencia || l.data.slice(0,7);
    if(comp!==mes) return s;
    return s + Number(l.valor||0);
  },0);

  return total;
}

// Gera N lançamentos mensais (um por mês, a partir do mês atual) para uma
// mensalidade ou financiamento com prazo para acabar. Usado tanto na
// conversão de contas fixas antigas quanto na importação da planilha.
function gerarParcelasFixas({descricao, valor, categoriaId, responsavel, forma, cartaoId, nParcelas}){
  for(let i=0;i<nParcelas;i++){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+i);
    const mes = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const data = i===0 ? hoje() : `${mes}-01`;
    push(ref(db,'lancamentos'), {
      tipo:'despesa', data, competencia:mes,
      descricao: `${descricao} (${i+1}/${nParcelas})`,
      valor: Number(valor), categoriaId: categoriaId||'', responsavel, forma, cartaoId: cartaoId||'',
      parcelaAtual: i+1, parcelaTotal: nParcelas,
      divisaoModo:'proporcional', percPedro:50, percSofia:50
    });
  }
}

function mesesRestantesAte(endMonthStr){
  const [ey,em] = endMonthStr.split('-').map(Number);
  const now = new Date();
  const diff = (ey-now.getFullYear())*12 + (em-1-now.getMonth());
  return Math.max(0, diff) + 1;
}

          <div class="field"><label>Até quando (opcional)</label><input type="month" name="dataFim" value="${editR?editR.dataFim||'':''}"></div>
        </div>
        <p class="hint">Deixe "Até quando" em branco se não tem previsão de parar. Quando preencher e o mês passar, a renda some sozinha da conta sem você precisar excluir.</p>
        <button type="submit">${editR?'Salvar alterações':'Adicionar'}</button>
        ${editR ? `<button type="button" class="secondary" id="btn-cancelar-edicao-renda">Cancelar edição</button>` : ''}
      </form>
    </div>
    <div class="panel-block">
      <h2>Fontes de renda</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Descrição</th><th>Resp.</th><th class="num">Valor</th><th>Tipo</th><th>Status</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="6" class="empty">Nenhuma fonte cadastrada.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;

  const rendaTipoSel = document.getElementById('renda-tipo');
  const togglePeriodo = ()=>{ document.getElementById('renda-periodo-fields').hidden = rendaTipoSel.value!=='1'; };
  rendaTipoSel.addEventListener('change', togglePeriodo);
  togglePeriodo();

  document.getElementById('form-renda').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const dados = {
      descricao:fd.get('descricao'), valor:Number(fd.get('valor')), responsavel:fd.get('responsavel'),
      recorrente: fd.get('recorrente')==='1',
      dataInicio: fd.get('dataInicio')||'', dataFim: fd.get('dataFim')||''
    };
    if(editandoRenda){
      update(ref(db,'rendas/'+editandoRenda), dados);
      editandoRenda = null;
    } else {
      push(ref(db,'rendas'), dados);
    }
    e.target.reset();
    renderRenda(el);
  });
  el.querySelectorAll('[data-edit-renda]').forEach(b=>{
    b.addEventListener('click', ()=>{ editandoRenda = b.dataset.editRenda; renderRenda(el); });
  });
  document.getElementById('btn-cancelar-edicao-renda')?.addEventListener('click', ()=>{ editandoRenda = null; renderRenda(el); });
  el.querySelectorAll('[data-del-renda]').forEach(b=> b.addEventListener('click', ()=>{
    if(editandoRenda===b.dataset.delRenda) editandoRenda = null;
    remove(ref(db,'rendas/'+b.dataset.delRenda));
  }));
}

let editandoFixa = null;
function renderContasFixas(el){
  const catOptions = Object.entries(state.categorias).map(([id,c])=>`<option value="${id}">${c.nome}</option>`).join('');
  const comp = mesAtual();

  const linhas = Object.entries(state.contasFixas)
    .sort((a,b)=> (a[1].descricao||'').localeCompare(b[1].descricao||''))
    .map(([id,r])=>{
      const gerado = !!(r.geradoEm && r.geradoEm[comp]);
      const ehMensalidadeAntiga = r.tipo==='parcela';
      const finalizada = ehMensalidadeAntiga && Number(r.mesesRestantes||0)<=0;
      let statusHtml;
      if(finalizada) statusHtml = '<span class="pill">finalizada</span>';
      else if(gerado) statusHtml = '<span class="pill">gerado este mês</span>';
      else statusHtml = '<span class="pill" style="border-color:var(--gold-soft);color:var(--gold)">pendente</span>';
      return `<tr>
        <td>${r.descricao}<div class="hint">${ehMensalidadeAntiga?'Mensalidade (antiga)':'Despesa fixa'} · ${labelPessoa(r.responsavel)} · ${FORMAS.find(f=>f[0]===r.forma)?.[1]||r.forma}${r.categoriaId&&state.categorias[r.categoriaId]?' · '+state.categorias[r.categoriaId].nome:''}</div></td>
        <td><input type="number" class="num" style="width:90px" step="0.01" data-fixa="${id}" data-campo="valor" value="${r.valor}"></td>
        <td class="num">${ehMensalidadeAntiga ? `<input type="number" class="num" style="width:55px" data-fixa="${id}" data-campo="mesesRestantes" value="${r.mesesRestantes}" min="0">` : '-'}</td>
        <td>${statusHtml}</td>
        <td>${ehMensalidadeAntiga && !finalizada ? `<button class="secondary small" data-converter-fixa="${id}">converter em lançamentos</button> ` : ''}<button class="secondary small" data-edit-fixa="${id}">editar</button> <button class="danger small" data-del-fixa="${id}">excluir</button></td>
      </tr>`;
    }).join('');

  const temMensalidadeAntiga = Object.values(state.contasFixas).some(r=>r.tipo==='parcela' && Number(r.mesesRestantes||0)>0);
  const editF = editandoFixa ? state.contasFixas[editandoFixa] : null;

  el.innerHTML = `
    <div class="panel-block">
      <h2>${editF ? 'Editar conta fixa' : 'Nova conta fixa'}</h2>
      <p class="hint">Contas fixas aqui são despesas recorrentes sem previsão de término (assinatura, gasolina). Como o app não roda um servidor o tempo todo, o lançamento do mês não se gera sozinho: clique em "gerar lançamentos do mês" (abaixo) quando abrir o app.</p>
      <p class="hint">Mensalidade ou financiamento com prazo pra acabar (ex.: parcela de um produto, consórcio)? Cadastre direto na aba <strong>Lançamentos</strong>, como despesa, forma crédito, marcando "Parcelado = Sim" e informando quantas parcelas ainda faltam. Todas as parcelas futuras já são geradas de uma vez, sem precisar voltar aqui todo mês.</p>
      <form id="form-fixa">
        <div class="row">
          <div class="field"><label>Descrição</label><input type="text" name="descricao" value="${editF?editF.descricao.replace(/"/g,'&quot;'):''}" required></div>
          <div class="field"><label>Valor mensal (R$)</label><input type="number" step="0.01" name="valor" value="${editF?editF.valor:''}" required></div>
        </div>
        <p class="hint">Ao clicar em "Gerar lançamentos do mês", a conta entra na fatura do mês atual (no crédito) ou nos gastos do mês (débito e PIX).</p>
        <div class="row">
          <div class="field"><label>Categoria</label><select name="categoriaId"><option value="">(sem categoria)</option>${Object.entries(state.categorias).map(([id,c])=>`<option value="${id}" ${editF&&editF.categoriaId===id?'selected':''}>${c.nome}</option>`).join('')}</select></div>
          <div class="field"><label>Responsável</label><select name="responsavel">${PESSOAS.map(([v,l])=>`<option value="${v}" ${editF&&editF.responsavel===v?'selected':''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label>Forma de pagamento</label>
            <select name="forma" id="fixa-forma">${FORMAS.map(([v,l])=>`<option value="${v}" ${editF&&editF.forma===v?'selected':''}>${l}</option>`).join('')}</select>
          </div>
        </div>
        <div class="row" id="fixa-cartao-field" hidden>
          <div class="field"><label>Cartão</label><select name="cartaoId">${Object.entries(state.cartoes).map(([id,c])=>`<option value="${id}" ${editF&&editF.cartaoId===id?'selected':''}>${c.nome} (${labelPessoa(c.titular)})</option>`).join('')}</select></div>
        </div>
        <button type="submit">${editF?'Salvar alterações':'Adicionar'}</button>
        ${editF ? `<button type="button" class="secondary" id="btn-cancelar-edicao-fixa">Cancelar edição</button>` : ''}
      </form>
    </div>
    <div class="panel-block">
      <div class="row" style="align-items:center;">
        <h2 style="border:none;">Contas fixas cadastradas</h2>
        <button id="btn-gerar-mes" class="secondary">Gerar lançamentos do mês</button>
      </div>
      <p class="hint">Valor e meses restantes salvam ao sair do campo. Use "editar" pra mudar descrição, categoria, responsável, forma ou cartão.${temMensalidadeAntiga ? ' Use "converter em lançamentos" nas mensalidades antigas abaixo para já gerar de uma vez todas as parcelas que faltam, sem precisar clicar todo mês.' : ''}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Descrição</th><th class="num">Valor</th><th class="num">Meses</th><th>Status</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="5" class="empty">Nenhuma conta fixa cadastrada.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;

  const formaSel = document.getElementById('fixa-forma');
  const toggle = ()=>{
    document.getElementById('fixa-cartao-field').hidden = formaSel.value!=='credito';
  };
  formaSel.addEventListener('change', toggle);
  toggle();

  document.getElementById('form-fixa').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const dados = {
      descricao:fd.get('descricao'), valor:Number(fd.get('valor')),
      categoriaId:fd.get('categoriaId')||'',
      responsavel:fd.get('responsavel'), forma:fd.get('forma'), cartaoId:fd.get('cartaoId')||''
    };
    if(editandoFixa){
      update(ref(db,'contasFixas/'+editandoFixa), dados);
      editandoFixa = null;
    } else {
      push(ref(db,'contasFixas'), { ...dados, tipo:'recorrente', mesesRestantes:0, geradoEm:{} });
    }
    e.target.reset();
    renderContasFixas(el);
  });

  el.querySelectorAll('input[data-fixa]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      update(ref(db,'contasFixas/'+inp.dataset.fixa), { [inp.dataset.campo]: Number(inp.value)||0 });
    });
  });
  el.querySelectorAll('[data-edit-fixa]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editandoFixa = b.dataset.editFixa;
      renderContasFixas(el);
    });
  });
  document.getElementById('btn-cancelar-edicao-fixa')?.addEventListener('click', ()=>{
    editandoFixa = null;
    renderContasFixas(el);
  });

  document.getElementById('btn-gerar-mes').addEventListener('click', ()=>{
    Object.entries(state.contasFixas).forEach(([id,r])=>{
      if(r.geradoEm && r.geradoEm[comp]) return;
      if(r.tipo==='parcela' && Number(r.mesesRestantes||0)<=0) return;
      push(ref(db,'lancamentos'), {
        tipo:'despesa', data:hoje(), competencia:comp, descricao:r.descricao, valor:Number(r.valor),
        categoriaId:r.categoriaId, responsavel:r.responsavel, forma:r.forma, cartaoId:r.cartaoId||'',
        parcelaAtual:1, parcelaTotal:1,
        divisaoModo:'proporcional', percPedro:50, percSofia:50
      });
      const updates = { ['geradoEm/'+comp]: true };
      if(r.tipo==='parcela') updates.mesesRestantes = Math.max(0, Number(r.mesesRestantes||0)-1);
      update(ref(db,'contasFixas/'+id), updates);
    });
  });
  el.querySelectorAll('[data-del-fixa]').forEach(b=> b.addEventListener('click', ()=>{
    if(editandoFixa===b.dataset.delFixa) editandoFixa = null;
    remove(ref(db,'contasFixas/'+b.dataset.delFixa));
  }));
  el.querySelectorAll('[data-converter-fixa]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.converterFixa;
      const r = state.contasFixas[id];
      const nParcelas = Number(r.mesesRestantes||0);
      if(nParcelas<=0) return;
      if(!confirm(`Gerar ${nParcelas} lançamento(s) de "${r.descricao}" em Lançamentos (um por mês, a partir deste mês) e remover esta conta fixa antiga?`)) return;
      gerarParcelasFixas({
        descricao:r.descricao, valor:r.valor, categoriaId:r.categoriaId,
        responsavel:r.responsavel, forma:r.forma, cartaoId:r.cartaoId,
        nParcelas
      });
      remove(ref(db,'contasFixas/'+id));
    });
  });
}

// Projeta renda recorrente ativa menos contas fixas (mensalidades decrescendo
// mês a mês, despesas recorrentes continuando) para os próximos N meses.
function projetarFluxo(nMeses){
  const resultado = [];
  const hojeD = new Date();
  let acumulado = 0;
  for(let i=0;i<nMeses;i++){
    const d = new Date(hojeD.getFullYear(), hojeD.getMonth()+i, 1);
    const mes = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

    const renda = Object.values(state.rendas).reduce((s,r)=>{
      if(!r.recorrente || !rendaAtivaNoMes(r, mes)) return s;
      return s + Number(r.valor||0);
    },0);

    const fixas = totalContasFixasMes(mes, i);

    const saldo = renda - fixas;
    acumulado += saldo;
    resultado.push({mes, renda, fixas, saldo, acumulado});
  }
  return resultado;
}

function renderRelatorios(){
  const el = document.getElementById('tab-relatorios');
  const comp = mesAtual();

  const linhasCat = Object.entries(state.categorias).map(([id,cat])=>{
    const gC = gastoCategoria(id,'casal','mensal'), lC = limiteCategoria(cat,'casal','mensal');
    const gP = gastoCategoria(id,'pedro','mensal'), lP = limiteCategoria(cat,'pedro','mensal');
    const gS = gastoCategoria(id,'sofia','mensal'), lS = limiteCategoria(cat,'sofia','mensal');
    const pct = (g,l)=> l>0 ? Math.round((g/l)*100)+'%' : '-';
    return `<tr>
      <td>${cat.nome}</td>
      <td class="num">${fmtBRL(gC)} / ${lC>0?fmtBRL(lC):'-'} (${pct(gC,lC)})</td>
      <td class="num">${fmtBRL(gP)} / ${lP>0?fmtBRL(lP):'-'} (${pct(gP,lP)})</td>
      <td class="num">${fmtBRL(gS)} / ${lS>0?fmtBRL(lS):'-'} (${pct(gS,lS)})</td>
    </tr>`;
  }).join('');

  const catIds = Object.keys(state.categorias);
  const opts = catIds.map(id=>`<option value="${id}">${state.categorias[id].nome}</option>`).join('');

  el.innerHTML = `
    <div class="panel-block">
      <div class="row" style="align-items:center;">
        <h2 style="border:none;">Gasto por categoria (mês atual, ${comp})</h2>
        <button id="btn-export-csv" class="secondary">Exportar CSV</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Categoria</th><th class="num">Casal</th><th class="num">Pedro</th><th class="num">Sofia</th></tr></thead>
        <tbody>${linhasCat || '<tr><td colspan="4" class="empty">Nenhuma categoria ainda.</td></tr>'}</tbody>
      </table></div>
    </div>

    <div class="panel-block">
      <h2>Tendência por categoria (últimos 6 meses)</h2>
      <div class="field" style="max-width:260px;"><select id="rel-cat">${opts}</select></div>
      <div id="rel-tendencia" style="margin-top:1em;"></div>
    </div>

    <div class="panel-block">
      <div class="row" style="align-items:center;">
        <h2 style="border:none;">Previsão de fluxo de caixa</h2>
        <div class="field" style="max-width:160px; margin:0;">
          <select id="rel-horizonte">
            <option value="6">6 meses</option>
            <option value="12" selected>12 meses</option>
            <option value="24">24 meses</option>
          </select>
        </div>
      </div>
      <p class="hint">Projeta a renda recorrente cadastrada (aba Renda) contra as contas fixas cadastradas (aba Contas fixas), mês a mês, considerando quando cada renda começa/termina e quando cada mensalidade acaba. Não inclui lançamentos avulsos nem gastos variáveis do dia a dia (alimentação, lazer etc.), só o que está fixado nessas duas abas.</p>
      <div id="rel-previsao"></div>
    </div>
  `;

  document.getElementById('btn-export-csv').addEventListener('click', exportarCSV);

  const horizSel = document.getElementById('rel-horizonte');
  const desenhaPrevisao = ()=>{
    const n = Number(horizSel.value);
    const linhas = projetarFluxo(n);
    const rows = linhas.map(l=>`
      <tr>
        <td>${formatMesAno(l.mes)}</td>
        <td class="num">${fmtBRL(l.renda)}</td>
        <td class="num">${fmtBRL(l.fixas)}</td>
        <td class="num" style="color:${l.saldo<0?'var(--bad)':'var(--good)'}">${fmtBRL(l.saldo)}</td>
        <td class="num" style="color:${l.acumulado<0?'var(--bad)':'var(--ink)'}">${fmtBRL(l.acumulado)}</td>
      </tr>
    `).join('');
    document.getElementById('rel-previsao').innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr><th>Mês</th><th class="num">Renda prevista</th><th class="num">Contas fixas</th><th class="num">Saldo do mês</th><th class="num">Acumulado</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `;
  };
  horizSel.addEventListener('change', desenhaPrevisao);
  desenhaPrevisao();

  const catSel = document.getElementById('rel-cat');
  if(catIds.length){
    const desenhaTendencia = ()=>{
      const meses = [];
      const d = new Date();
      for(let i=5;i>=0;i--){
        const dd = new Date(d.getFullYear(), d.getMonth()-i, 1);
        meses.push(`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}`);
      }
      const catId = catSel.value;
      const valores = meses.map(m=> Object.values(state.lancamentos)
        .filter(l=>l.categoriaId===catId && (l.competencia||l.data.slice(0,7))===m)
        .reduce((s,l)=>s+Number(l.valor||0),0));
      const max = Math.max(1, ...valores);
      document.getElementById('rel-tendencia').innerHTML = meses.map((m,i)=>`
        <div style="display:flex; align-items:center; gap:.6em; margin-bottom:.4em;">
          <div style="width:56px; font-size:.78rem; color:var(--muted);">${m.slice(5)}/${m.slice(2,4)}</div>
          <div style="flex:1; background:var(--paper-line); border-radius:3px; height:14px;">
            <div style="width:${(valores[i]/max)*100}%; background:var(--gold); height:100%; border-radius:3px;"></div>
          </div>
          <div style="width:90px; text-align:right; font-size:.78rem;">${fmtBRL(valores[i])}</div>
        </div>
      `).join('');
    };
    catSel.addEventListener('change', desenhaTendencia);
    desenhaTendencia();
  } else {
    document.getElementById('rel-tendencia').innerHTML = '<div class="empty">Cadastre categorias para ver a tendência.</div>';
  }
}

function exportarCSV(){
  const linhas = [['data','tipo','descricao','categoria','responsavel','forma','valor']];
  Object.values(state.lancamentos).sort((a,b)=>a.data.localeCompare(b.data)).forEach(l=>{
    linhas.push([l.data, (l.tipo||'despesa'), l.descricao, state.categorias[l.categoriaId]?.nome||'', l.responsavel, l.forma||'', String(l.valor).replace('.',',')]);
  });
  const csv = linhas.map(l=> l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `lancamentos_${mesAtual()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
